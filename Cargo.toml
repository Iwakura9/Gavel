[package]
name = "gavel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Debates between Claude agents in the terminal"
license = "MIT"
repository = "https://github.com/Iwakura9/Gavel"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
